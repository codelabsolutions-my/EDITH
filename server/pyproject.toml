[project]
name = "edith-server"
version = "0.0.0"
description = "EDITH backend — agent core, voice pipeline, auth, and the connector framework."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "yoyo-migrations>=9",
    "psycopg2-binary>=2.9",  # yoyo's sync driver for applying migrations
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Ruff (lint + format) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = []

# ─── Mypy ─────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
packages = ["app"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

# Third-party packages without type stubs / py.typed markers.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "yoyo", "yoyo.*", "psycopg2", "psycopg2.*"]
ignore_missing_imports = true

# ─── Pytest ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Coverage is reported in CI (no hard gate — see docs/engineering.md). Run with:
#   pytest --cov=app --cov-report=term-missing

# ─── Coverage ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/connectors/examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
