name: 🐛 Bug report
description: Report something that isn't working
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please don't include secrets or personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - server (agent / voice / auth)
        - app (Flutter client)
        - connector
        - docs
        - other / not sure
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Android 14 / iOS 17 / Web (Chrome) / server
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact secrets) or attach screenshots.
      render: shell
